<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc17b"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#9e7d3b"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1c16"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </radialGradient>
  </defs>

  <!-- Background Base (Square for Apple Icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  
  <!-- Subtle Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.8"/>

  <!-- Brand Typography: G | C -->
  <text x="145" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">G</text>
  
  <!-- Gold Vertical Divider Bar -->
  <rect x="249" y="116" width="14" height="280" rx="7" fill="url(#goldGrad)"/>
  
  <!-- C Letter in Gold -->
  <text x="367" y="335" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-4">C</text>
  
  <!-- Subtle Tagline Dots -->
  <circle cx="210" cy="425" r="5" fill="url(#goldGrad)"/>
  <circle cx="256" cy="425" r="5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="302" cy="425" r="5" fill="url(#goldGrad)"/>
</svg>
